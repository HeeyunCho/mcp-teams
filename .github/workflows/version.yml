# Bumps the version on every change merged into main, commits and tags it, then
# publishes that version to npm. The bump level comes from the pushed commit messages
# (see scripts/bump-version.mjs). Publishing uses npm trusted publishing (OIDC): npm
# trusts this workflow file of this repository, so there is no npm token and every
# release carries provenance. Publishing happens here, not in a workflow on the tag,
# because pushes made with GITHUB_TOKEN don't start other workflows.
name: Version bump

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  id-token: write # npm trusted publishing

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    # Pushes made with GITHUB_TOKEN do not trigger workflows, so the bump commit cannot loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - name: Bump version
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # The first push has no parent commit to compare with.
            if git cat-file -e "HEAD~1^{commit}" 2>/dev/null; then RANGE="HEAD~1..HEAD"; else RANGE="HEAD"; fi
          else
            RANGE="$BEFORE..HEAD"
          fi
          VERSION=$(git log --format=%B%x00 "$RANGE" | node scripts/bump-version.mjs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      # Tests ran above; prepublishOnly would run them again.
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
